name: Build and publish releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-target: --win
          - os: macos-latest
            builder-target: --mac
          - os: ubuntu-latest
            builder-target: --linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter desktop typecheck

      - name: Match application version to release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); const path = "apps/desktop/package.json"; const pkg = JSON.parse(fs.readFileSync(path, "utf8")); const version = process.env.GITHUB_REF_NAME.replace(/^v/, ""); if (!/^\d+\.\d+\.\d+(?:[-+][\w.-]+)?$/.test(version)) throw new Error(`Release tag must contain a semantic version: ${process.env.GITHUB_REF_NAME}`); pkg.version = version; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");'

      - name: Build application
        run: pnpm --filter desktop build

      - name: Package and publish GitHub Release
        if: github.ref_type == 'tag'
        run: pnpm --filter desktop exec electron-builder ${{ matrix.builder-target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package manual workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter desktop exec electron-builder ${{ matrix.builder-target }} --publish never

      - name: Upload manual workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CavalloCode-${{ matrix.os }}
          path: apps/desktop/dist/*
          if-no-files-found: error
